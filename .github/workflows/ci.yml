name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets anywhere: debug builds use the Yandex demo units, and :app builds without the RuStore
# SDK (its Maven repository refuses many machines; the property simply leaves the SDK out).
env:
  # The wrapper otherwise keeps its Gradle home inside the checkout, out of reach of the cache.
  GRADLE_USER_HOME: /home/runner/.gradle

jobs:
  ktlint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew ktlintCheck

  puzzle-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # JVM plus headless Chrome for JS and Wasm, so the golden determinism tests run on every target.
      - run: bash ./gradlew :puzzle-core:allTests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew :web-app:jsBrowserTest

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # compileSdk 36, as in app/build.gradle.kts; the runner image ships the SDK itself.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: bash ./gradlew -Plogica.withoutRustore=true :app:testDebugUnitTest :app:lintRelease

  web-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The Yandex upload itself: the JS/Wasm production bundles plus the distribution checks.
      - run: bash ./gradlew :web-app:packageYandexDistribution
