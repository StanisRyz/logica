org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The Kotlin daemon links the Wasm and JS production bundles in memory; 2 GB made it thrash in
# garbage collection for an hour instead of finishing in minutes.
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Reuse task outputs (clean builds, branch switches) and the configured task graph between runs.
org.gradle.caching=true
org.gradle.configuration-cache=true
