<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Логика</title>
    <!-- Relative paths: Yandex serves the game from a nested folder. Made by tools/art/make_app_icon.py. -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
    <style>
        html, body, #ComposeApp {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }

        /* The theme's background, so the page does not flash another color before the first frame. */
        body {
            background: #f7f3ea;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #171a17;
            }
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
<div id="ComposeApp"></div>
<script src="/sdk.js"></script>
<script src="logica-web.js"></script>
</body>
</html>
